appId: com.innotrat.innoide
productName: InnoIDE
copyright: Copyright © 2026 Innotrat Labs
electronDist: node_modules/electron/dist
npmRebuild: false
asar: true
compression: store

extraMetadata:
  dependencies: {}

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

portable:
  artifactName: InnoIDE-Portable-${version}.exe

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: InnoIDE-Setup-${version}.exe
